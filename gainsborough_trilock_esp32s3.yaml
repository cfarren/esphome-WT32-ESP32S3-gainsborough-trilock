# ESPHome config for the Gainsborough Freestyle Trilock BLE bridge, ESP32-S3.
# No cloud/Cognito calls at all — pure local BLE lock/unlock/status.
# Battery percentage is not available locally; the lock's BLE protocol never
# exposes it (confirmed by investigation), so battery is read from the lock's
# own physical indicator instead of a Home Assistant entity.
# Swap `esp32.board` below for your exact ESP32-S3 Mini variant if needed.

substitutions:
  device_name: "gainsborough-trilock"
  friendly_name: "Front Door Lock"

esphome:
  name: "${device_name}"
  friendly_name: "${friendly_name}"
  comment: "Gainsborough Freestyle Trilock BLE bridge - fully local, no cloud"
  on_boot:
    priority: 200
    then:
      - logger.log: "Waiting for WiFi before enabling BLE activity..."
      - wait_until:
          wifi.connected:
      - logger.log: "WiFi connected, BLE coexistence is now active."

esp32:
  board: esp32-s3-devkitc-1   # Waveshare ESP32-S3-Zero (ESP32-S3FH4R2)
  variant: esp32s3
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32_WIFI_SW_COEXIST_ENABLE: "y"
      CONFIG_BT_CTRL_COEX_PHY_CODED_TX_RX_PRIO_ENABLE: "y"
      CONFIG_BT_CTRL_SCAN_PRIO_HIGH: "y"
      CONFIG_BT_CTRL_COEX_PRIORITY_AUTO: "y"
      CONFIG_BT_CTRL_CHAN_ASSESS_ENABLE: "y"
      CONFIG_SW_COEXIST_PREFERENCE_BALANCE: "y"
      CONFIG_BT_CTRL_DFT_TX_PWR_LEVEL_P9: "y"
      CONFIG_MBEDTLS_GCM_C: "y"
      CONFIG_MBEDTLS_HARDWARE_GCM: "n"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"

external_components:
  - source: gainsborough_trilock

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: LIGHT
  output_power: 15dBm
  fast_connect: true
  ap:
    ssid: "${device_name} Fallback"
    password: !secret ota_password

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption:
      key: !secret api_encryption_key

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG   # native USB-C, no separate UART bridge chip
  logs:
    esp32_ble: DEBUG
    esp32_ble_client: DEBUG
    esp32_ble_tracker: DEBUG
    gainsborough_trilock: DEBUG

esp32_ble_tracker:
  id: esp32_ble_tracker_hub
  scan_parameters:
    interval: 120ms
    window: 60ms
    active: false
  on_ble_advertise:
    - mac_address: !secret trilock_ble_mac
      then:
        - lambda: |-
            id(trilock_rssi).publish_state(x.get_rssi());

ble_client:
  - mac_address: !secret trilock_ble_mac
    id: trilock_ble
    auto_connect: true
    on_connect:
      then:
        - logger.log: "Trilock BLE connected"
        - text_sensor.template.publish:
            id: last_connected
            state: !lambda 'return id(ha_time).now().strftime("%Y-%m-%d %H:%M:%S");'
    on_disconnect:
      then:
        - logger.log: "Trilock BLE disconnected"

debug:
  update_interval: 60s

# --- Lock entity: fully local BLE, no cloud connectivity of any kind ---
lock:
  - platform: gainsborough_trilock
    id: trilock
    name: "${friendly_name}"
    ble_client_id: trilock_ble
    aes_key: !secret trilock_aes_key
    sync_debug: false
    update_interval: 30s
    icon: mdi:door-closed-lock
    lock_status_sensor:
      id: lock_status_text
      name: "${friendly_name} Detailed Status"
      icon: mdi:lock-check
    # Battery level/low entities removed: the local BLE protocol never actually
    # carries battery data (confirmed by investigation — see README). Rely on
    # the lock's own physical low-battery indicator (beep/LED) instead.

# --- Runtime-editable override -----------------------------------------------
# Backed by flash (restore_value: true): once you change it from Home Assistant,
# the new value survives reboots and OTA updates with no recompile or reflash
# needed. initial_value only matters on the very first boot, to seed the field
# from secrets.yaml so it works immediately after flashing.
text:
  - platform: template
    name: "${friendly_name} - AES Key Override"
    id: aes_key_override
    mode: password
    icon: mdi:key-variant
    entity_category: config
    restore_value: true
    initial_value: !secret trilock_aes_key
    optimistic: true
    on_value:
      then:
        - lambda: |-
            id(trilock).set_aes_key_string(x);

button:
  - platform: template
    name: "${friendly_name} - Privacy Lock"
    id: btn_privacy_lock
    icon: mdi:door-closed-lock
    on_press:
      then:
        - lambda: |-
            id(trilock).set_target_state(2);

  - platform: template
    name: "${friendly_name} - Deadlock"
    id: btn_deadlock
    icon: mdi:shield-lock
    on_press:
      then:
        - lambda: |-
            id(trilock).set_target_state(3);

  - platform: template
    name: "${friendly_name} - Request Status"
    id: btn_request_status
    icon: mdi:refresh
    on_press:
      then:
        - lambda: |-
            id(trilock).request_status();

  - platform: restart
    name: "${friendly_name} Restart"
    id: btn_restart
    icon: mdi:restart
    entity_category: diagnostic

binary_sensor:
  - platform: template
    name: "${friendly_name} BLE Connected"
    id: ble_conn_status
    device_class: connectivity
    entity_category: diagnostic
    lambda: |-
      return id(trilock_ble).connected();

sensor:
  - platform: wifi_signal
    name: "${friendly_name} WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: template
    name: "${friendly_name} BLE Signal"
    id: trilock_rssi
    unit_of_measurement: "dBm"
    device_class: signal_strength
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    # Populated from advertisement scanning (esp32_ble_tracker.on_ble_advertise)
    # rather than the ble_client RSSI platform, since this device only holds
    # a GATT connection open for well under a second per transaction — a
    # connection-based RSSI read would show Unknown most of the time.

  - platform: debug
    free:
      name: "${friendly_name} Heap Free"
      entity_category: diagnostic
    loop_time:
      name: "${friendly_name} Loop Time"
      entity_category: diagnostic

text_sensor:
  - platform: version
    name: "${friendly_name} ESPHome Version"
    entity_category: diagnostic
    hide_timestamp: true
    disabled_by_default: true

  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP Address"
      entity_category: diagnostic
    ssid:
      name: "${friendly_name} WiFi SSID"
      entity_category: diagnostic
      disabled_by_default: true

  - platform: template
    name: "${friendly_name} Last Connected"
    id: last_connected
    icon: mdi:clock-check-outline
    entity_category: diagnostic

time:
  - platform: homeassistant
    id: ha_time
