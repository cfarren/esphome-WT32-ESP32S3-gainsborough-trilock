# Gainsborough Trilock BLE bridge — local BLE for lock/unlock/status,
# cloud (Cognito) used only for periodic battery/door telemetry.

substitutions:
  device_name: "gainsborough-trilock"
  friendly_name: "Front Door Lock"

esphome:
  name: "${device_name}"
  friendly_name: "${friendly_name}"
  comment: "Gainsborough Freestyle Trilock BLE bridge on ESP32-S3 (WiFi+BLE)"
  on_boot:
    priority: 200
    then:
      - logger.log: "Waiting for WiFi before enabling BLE activity..."
      - wait_until:
          wifi.connected:
      - logger.log: "WiFi connected, BLE coexistence is now active."

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32_WIFI_SW_COEXIST_ENABLE: "y"
      CONFIG_BT_CTRL_COEX_PHY_CODED_TX_RX_PRIO_ENABLE: "y"
      CONFIG_BT_CTRL_SCAN_PRIO_HIGH: "y"
      CONFIG_BT_CTRL_COEX_PRIORITY_AUTO: "y"
      CONFIG_BT_CTRL_CHAN_ASSESS_ENABLE: "y"
      CONFIG_SW_COEXIST_PREFERENCE_BALANCE: "y"
      CONFIG_BT_CTRL_DFT_TX_PWR_LEVEL_P9: "y"
      CONFIG_MBEDTLS_GCM_C: "y"
      CONFIG_MBEDTLS_HARDWARE_GCM: "n"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"

external_components:
  - source: gainsborough_trilock

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: LIGHT
  output_power: 15dBm
  fast_connect: true
  ap:
    ssid: "${device_name} Fallback"
    password: !secret ota_password

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG   # native USB-C, no separate UART bridge chip
  logs:
    esp32_ble: DEBUG
    esp32_ble_client: DEBUG
    esp32_ble_tracker: DEBUG
    gainsborough_trilock: DEBUG

esp32_ble_tracker:
  id: esp32_ble_tracker_hub
  scan_parameters:
    interval: 120ms
    window: 60ms
    active: false

ble_client:
  - mac_address: !secret trilock_ble_mac
    id: trilock_ble
    auto_connect: true
    on_connect:
      then:
        - logger.log: "Trilock BLE connected"
    on_disconnect:
      then:
        - logger.log: "Trilock BLE disconnected"

# --- Lock entity: local BLE for lock/unlock/status, cloud only for battery (every 6h) ---
lock:
  - platform: gainsborough_trilock
    id: trilock
    name: "${friendly_name}"
    ble_client_id: trilock_ble
    aes_key: !secret trilock_aes_key
    sync_debug: false
    update_interval: 30s
    cloud:
      refresh_token: !secret freestyle_refresh_token
      property_id: !secret freestyle_property_id
      ble_mac: !secret freestyle_cloud_ble_mac
      client_id: !secret freestyle_client_id
      client_secret: !secret freestyle_client_secret
      update_interval: 6h
    icon: mdi:door-closed-lock
    lock_status_sensor:
      id: lock_status_text
      name: "${friendly_name} Detailed Status"
      icon: mdi:lock-check
    battery_level:
      name: "${friendly_name} Battery Level"
      id: battery_level
    battery_low:
      name: "${friendly_name} Battery Low"
      id: battery_low

number:
  - platform: template
    name: "${friendly_name} - Cloud Battery Poll Interval (hours)"
    id: cloud_poll_interval_hours
    icon: mdi:timer-cog-outline
    entity_category: config
    min_value: 1
    max_value: 24
    step: 1
    initial_value: 6
    optimistic: true
    restore_value: true
    on_value:
      then:
        - lambda: |-
            id(trilock).set_cloud_update_interval_ms((uint32_t)(x * 3600000.0f));

button:
  - platform: template
    name: "${friendly_name} - Privacy Lock"
    id: btn_privacy_lock
    icon: mdi:door-closed-lock
    on_press:
      then:
        - lambda: |-
            id(trilock).set_target_state(2);

  - platform: template
    name: "${friendly_name} - Deadlock"
    id: btn_deadlock
    icon: mdi:shield-lock
    on_press:
      then:
        - lambda: |-
            id(trilock).set_target_state(3);

  - platform: template
    name: "${friendly_name} - Request Status"
    id: btn_request_status
    icon: mdi:refresh
    on_press:
      then:
        - lambda: |-
            id(trilock).request_status();

  - platform: restart
    name: "${friendly_name} Restart"
    id: btn_restart
    icon: mdi:restart
    entity_category: diagnostic

binary_sensor:
  - platform: template
    name: "${friendly_name} BLE Connected"
    id: ble_conn_status
    device_class: connectivity
    entity_category: diagnostic
    lambda: |-
      return id(trilock_ble).connected();

sensor:
  - platform: wifi_signal
    name: "${friendly_name} WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "${friendly_name} Uptime"
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  - platform: version
    name: "${friendly_name} ESPHome Version"
    entity_category: diagnostic
    hide_timestamp: true
    disabled_by_default: true

  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP Address"
      entity_category: diagnostic
    ssid:
      name: "${friendly_name} WiFi SSID"
      entity_category: diagnostic
      disabled_by_default: true

time:
  - platform: homeassistant
    id: ha_time
